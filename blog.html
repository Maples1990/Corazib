<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updates — Corazon Creative Co.</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260327">
  <style>
    body {
      background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg) 40%, var(--bg-bottom) 100%);
      min-height: 100vh;
    }

    .blog-shell {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px 60px;
    }

    .blog-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 28px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--accent-deep);
    }

    .blog-title {
      margin: 0 0 8px;
      font-family: "Fraunces", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1;
    }

    .blog-subtitle {
      margin: 0 0 40px;
      color: var(--muted);
      line-height: 1.7;
    }

    .blog-placeholder {
      padding: 48px 32px;
      text-align: center;
      border: 1px dashed rgba(31, 26, 25, 0.15);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.5);
    }

    .blog-placeholder-icon {
      display: block;
      margin: 0 auto 16px;
      font-size: 2.5rem;
      line-height: 1;
    }

    .blog-placeholder h2 {
      margin: 0 0 8px;
      font-family: "Fraunces", serif;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .blog-placeholder p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    .blog-placeholder .button {
      display: inline-flex;
    }

    .blog-posts {
      display: grid;
      gap: 28px;
    }

    .blog-post {
      padding: 28px;
      border: 1px solid rgba(31, 26, 25, 0.08);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 14px 30px rgba(49, 35, 22, 0.06);
    }

    .blog-post time {
      display: block;
      margin-bottom: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .blog-post h2 {
      margin: 0 0 14px;
      font-family: "Fraunces", serif;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .blog-post p {
      margin: 0 0 10px;
      color: var(--muted);
      line-height: 1.7;
    }

    .blog-post p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="blog-shell">
    <a class="blog-back" href="/">← Back to Corazon Creative Co.</a>
    <h1 class="blog-title">Updates</h1>
    <p class="blog-subtitle">News, behind-the-scenes looks, and announcements from Corazon Creative Co.</p>

    <div class="blog-posts" id="blog-posts"></div>

    <div class="blog-placeholder" id="blog-placeholder" hidden>
      <span class="blog-placeholder-icon" aria-hidden="true">✦</span>
      <h2>Coming soon</h2>
      <p>We are working on sharing updates here — new designs, seasonal drops, behind-the-scenes process, and more. Check back soon.</p>
      <a class="button button-primary" href="/#order">Start an order</a>
    </div>
  </div>

  <script src="blog-page.js?v=20260327"></script>
  <script src="script.js?v=20260327"></script>
</body>
</html>
