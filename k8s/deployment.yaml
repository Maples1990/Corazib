apiVersion: apps/v1
kind: Deployment
metadata:
  name: corazon
  namespace: default
  labels:
    app: corazon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: corazon
  template:
    metadata:
      labels:
        app: corazon
    spec:
      containers:
        - name: corazon
          image: ghcr.io/ericbreslin1-coder/corazon:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: APP_BASE_URL
              value: "https://corazoncreativeco.org"
            - name: CANONICAL_HOST
              value: "corazoncreativeco.org"
            - name: APP_ALLOWED_ORIGINS
              value: "https://www.corazoncreativeco.org"
            - name: ADMIN_EMAIL
              value: "maria@corazoncreativeco.com"
            - name: SESSION_SECRET
              value: "corazon-prod-8f3k2m9x7q4w1p5t6r"
            - name: ALLOW_DEV_ADMIN_CODE_RESPONSE
              value: "false"
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURE
              value: "false"
            - name: SMTP_USER
              value: "maria@corazoncreativeco.com"
            - name: SMTP_PASS
              value: "sgmlrwyjwoardnef"
            - name: SMTP_FROM
              value: "maria@corazoncreativeco.org"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: corazon-data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: corazon-data
          persistentVolumeClaim:
            claimName: corazon-data
