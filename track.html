<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order — Corazon Creative Co.</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260327">
  <style>
    body {
      background: linear-gradient(170deg, var(--bg-top) 0%, var(--bg) 40%, var(--bg-bottom) 100%);
      min-height: 100vh;
    }

    .track-shell {
      max-width: 640px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    .track-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 36px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-deep);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .track-back:hover { opacity: 0.7; }

    .track-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .track-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(106, 59, 179, 0.12), rgba(31, 76, 139, 0.10));
      font-size: 1.5rem;
    }

    .track-title {
      margin: 0 0 10px;
      font-family: "Fraunces", serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .track-subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .track-form-card {
      padding: 28px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--surface-shadow);
      margin-bottom: 32px;
      backdrop-filter: blur(12px);
    }

    .track-form {
      display: flex;
      gap: 12px;
    }

    .track-form input {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px solid rgba(31, 26, 25, 0.12);
      border-radius: var(--radius-md);
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .track-form input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(106, 59, 179, 0.10);
    }

    .track-form input::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    .track-results {
      display: grid;
      gap: 16px;
    }

    .track-card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(49, 35, 22, 0.06);
      backdrop-filter: blur(8px);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .track-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(49, 35, 22, 0.10);
    }

    .track-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .track-card-id {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .track-status {
      display: inline-flex;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: capitalize;
    }

    .track-status--new { background: rgba(106, 59, 179, 0.12); color: #6a3bb3; }
    .track-status--reviewed { background: rgba(31, 76, 139, 0.12); color: #1f4c8b; }
    .track-status--contacted { background: rgba(184, 134, 41, 0.14); color: #8a6500; }
    .track-status--in-design { background: rgba(106, 59, 179, 0.14); color: #5a2fa0; }
    .track-status--in-production { background: rgba(37, 211, 102, 0.14); color: #1a8d47; }
    .track-status--completed { background: rgba(37, 211, 102, 0.18); color: #157a3c; }

    .track-card-details {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .track-empty {
      padding: 40px 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(31, 26, 25, 0.15);
      border-radius: var(--radius-lg);
      background: var(--surface);
      font-size: 0.95rem;
    }

    .track-feedback {
      margin: 0 0 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-deep);
      text-align: center;
    }

    @media (max-width: 480px) {
      .track-form {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="track-shell">
    <a class="track-back" href="/">← Back to Corazon Creative Co.</a>

    <div class="track-header">
      <div class="track-icon" aria-hidden="true">📦</div>
      <h1 class="track-title">Track your order</h1>
      <p class="track-subtitle">Enter the email address you used when placing your order to see its current status.</p>
    </div>

    <div class="track-form-card">
      <form class="track-form" id="track-form">
        <input type="email" name="email" placeholder="you@example.com" required>
        <button class="button button-primary" type="submit">Look up</button>
      </form>
    </div>

    <p class="track-feedback" id="track-feedback" aria-live="polite"></p>
    <div class="track-results" id="track-results"></div>
  </div>

  <script>
    function getCsrfToken() {
      const match = document.cookie.match(/(?:^|;\s*)_csrf=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    }

    const form = document.getElementById('track-form');
    const feedback = document.getElementById('track-feedback');
    const results = document.getElementById('track-results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      if (!email) return;

      feedback.textContent = 'Looking up…';
      results.innerHTML = '';

      try {
        const res = await fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json', 'X-CSRF-Token': getCsrfToken() },
          body: JSON.stringify({ email }),
          credentials: 'same-origin',
        });

        const data = await res.json();
        if (!res.ok || !data.ok) {
          feedback.textContent = data.message || 'Something went wrong.';
          return;
        }

        if (!data.submissions || data.submissions.length === 0) {
          feedback.textContent = '';
          results.innerHTML = '<div class="track-empty">No orders found for that email address.</div>';
          return;
        }

        feedback.textContent = `Found ${data.submissions.length} submission${data.submissions.length > 1 ? 's' : ''}`;

        results.innerHTML = data.submissions.map((s) => {
          const date = new Date(s.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          const statusClass = 'track-status--' + s.status;
          const label = s.status.replace(/-/g, ' ');
          const details = [
            s.type === 'order' ? `${s.apparel || 'Apparel'}` : 'Contact message',
            s.quantity ? `Qty: ${s.quantity}` : '',
            `Submitted: ${date}`,
          ].filter(Boolean).join(' · ');

          return `<div class="track-card">
            <div class="track-card-header">
              <span class="track-card-id">${s.id}</span>
              <span class="track-status ${statusClass}">${label}</span>
            </div>
            <div class="track-card-details">${details}</div>
          </div>`;
        }).join('');
      } catch (_err) {
        feedback.textContent = 'Connection error. Please try again.';
      }
    });
  </script>
  <script src="script.js?v=20260326"></script>
</body>
