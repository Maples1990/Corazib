<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order — Corazon Creative Co.</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260325">
  <style>
    .track-shell {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 24px 60px;
    }

    .track-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 28px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--accent-deep);
    }

    .track-title {
      margin: 0 0 8px;
      font-family: "Fraunces", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1;
    }

    .track-subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.7;
    }

    .track-form {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .track-form input {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid rgba(31, 26, 25, 0.12);
      border-radius: 16px;
      font: inherit;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.84);
    }

    .track-form input:focus {
      outline: 2px solid rgba(106, 59, 179, 0.18);
      border-color: rgba(106, 59, 179, 0.36);
    }

    .track-results {
      display: grid;
      gap: 16px;
    }

    .track-card {
      padding: 22px;
      border: 1px solid rgba(31, 26, 25, 0.08);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 14px 30px rgba(49, 35, 22, 0.06);
    }

    .track-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .track-card-id {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .track-status {
      display: inline-flex;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: capitalize;
    }

    .track-status--new { background: rgba(106, 59, 179, 0.12); color: #6a3bb3; }
    .track-status--reviewed { background: rgba(31, 76, 139, 0.12); color: #1f4c8b; }
    .track-status--contacted { background: rgba(184, 134, 41, 0.14); color: #8a6500; }
    .track-status--in-design { background: rgba(106, 59, 179, 0.14); color: #5a2fa0; }
    .track-status--in-production { background: rgba(37, 211, 102, 0.14); color: #1a8d47; }
    .track-status--completed { background: rgba(37, 211, 102, 0.18); color: #157a3c; }

    .track-card-details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .track-empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(31, 26, 25, 0.12);
      border-radius: var(--radius-lg);
    }

    .track-feedback {
      margin: 0 0 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-deep);
    }
  </style>
</head>
<body>
  <div class="track-shell">
    <a class="track-back" href="/">← Back to Corazon Creative Co.</a>
    <h1 class="track-title">Track your order</h1>
    <p class="track-subtitle">Enter the email address you used when placing your order to see its current status.</p>

    <form class="track-form" id="track-form">
      <input type="email" name="email" placeholder="you@example.com" required>
      <button class="button button-primary" type="submit">Look up</button>
    </form>

    <p class="track-feedback" id="track-feedback" aria-live="polite"></p>
    <div class="track-results" id="track-results"></div>
  </div>

  <script>
    const form = document.getElementById('track-form');
    const feedback = document.getElementById('track-feedback');
    const results = document.getElementById('track-results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      if (!email) return;

      feedback.textContent = 'Looking up…';
      results.innerHTML = '';

      try {
        const res = await fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ email }),
          credentials: 'same-origin',
        });

        const data = await res.json();
        if (!res.ok || !data.ok) {
          feedback.textContent = data.message || 'Something went wrong.';
          return;
        }

        if (!data.submissions || data.submissions.length === 0) {
          feedback.textContent = '';
          results.innerHTML = '<div class="track-empty">No orders found for that email address.</div>';
          return;
        }

        feedback.textContent = `Found ${data.submissions.length} submission${data.submissions.length > 1 ? 's' : ''}`;

        results.innerHTML = data.submissions.map((s) => {
          const date = new Date(s.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          const statusClass = 'track-status--' + s.status;
          const label = s.status.replace(/-/g, ' ');
          const details = [
            s.type === 'order' ? `${s.apparel || 'Apparel'}` : 'Contact message',
            s.quantity ? `Qty: ${s.quantity}` : '',
            `Submitted: ${date}`,
          ].filter(Boolean).join(' · ');

          return `<div class="track-card">
            <div class="track-card-header">
              <span class="track-card-id">${s.id}</span>
              <span class="track-status ${statusClass}">${label}</span>
            </div>
            <div class="track-card-details">${details}</div>
          </div>`;
        }).join('');
      } catch (_err) {
        feedback.textContent = 'Connection error. Please try again.';
      }
    });
  </script>
  <script defer data-domain="corazoncreativeco.org" src="https://plausible.io/js/script.js"></script>
</body>
